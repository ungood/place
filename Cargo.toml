[package]
name = "place"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Manage workplaces: directories of independent git repositories"
license = "MIT"
repository = "https://github.com/ungood/place"

[dependencies]
clap = { version = "4.6", features = ["derive", "env", "wrap_help"] }
console = "0.16.6"
miette = { version = "7.6", features = ["fancy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10.0"
thiserror = "2"
toml_edit = "0.25.17"

[dev-dependencies]
cucumber = "0.23"
serde_json = "1"
strip-ansi-escapes = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync"] }
toml = "1"

[[test]]
name = "cucumber"
harness = false
