[package]
name = "place"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Manage workplaces: directories of independent git repositories"
license = "Apache-2.0"
repository = "https://github.com/ungood/place"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
miette = { version = "7.6", features = ["fancy"] }
thiserror = "2"

[dev-dependencies]
cucumber = "0.23"
serde_json = "1"
strip-ansi-escapes = "0.2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync"] }
toml = "1"

[[test]]
name = "cucumber"
harness = false
