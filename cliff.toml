# git-cliff works out the next version and the release notes from the
# conventional commits since the last v* tag. See .github/workflows/release.yml.

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  # Everything else, including the release commits, doesn't release.
  { message = ".*", skip = true },
]
tag_pattern = "v[0-9].*"

# While place is 0.x, fix bumps the patch, and feat or a breaking change
# bumps the minor.
[bump]
features_always_bump_minor = true
breaking_always_bump_major = false

[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true
