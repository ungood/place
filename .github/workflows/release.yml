name: Release

# Push a tag such as v0.1.0, matching the version in Cargo.toml, to release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches Cargo.toml
        run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml
      - run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: draft
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run dist
      - run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: jdx/packslip@v1
        with:
          download: place-*.tar.gz
          bin: place
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
