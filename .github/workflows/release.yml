name: Release

# Every push to main releases if a feat or fix commit has landed since the
# last release. git-cliff picks the version from those commits (see
# cliff.toml). This job bumps Cargo.toml, commits and tags that on main,
# builds the archives, and publishes them with packslip. Pushes made with
# github.token don't start workflows, so the release commit doesn't release
# again.
on:
  push:
    branches: [main]

# One release at a time, in the order of the pushes.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - id: version
        name: Work out the next version
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          next=$(mise run --quiet release:version)
          if [ "$next" = "$last" ]; then
            echo "No feat or fix commits since $last, so nothing to release."
          else
            echo "Releasing $next (last release: ${last:-none})."
            echo "tag=$next" >> "$GITHUB_OUTPUT"
          fi
      - id: commit
        name: Bump Cargo.toml, commit, tag and draft the release
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mise run --quiet release:notes > "$RUNNER_TEMP/notes.md"
          sed -i "0,/^version = .*/s//version = \"${TAG#v}\"/" Cargo.toml
          cargo update --workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $TAG"
          git tag "$TAG"
          git push --atomic origin HEAD:main "refs/tags/$TAG"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

  build:
    needs: tag
    if: needs.tag.outputs.tag != ''
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - uses: jdx/mise-action@v5
      - run: mise run dist
      - run: gh release upload "$TAG" dist/*.tar.gz
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}

  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: jdx/packslip@v1
        with:
          tag: ${{ needs.tag.outputs.tag }}
          commit: ${{ needs.tag.outputs.commit }}
          download: place-*.tar.gz
          bin: place
      - run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          TAG: ${{ needs.tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
