[tools]
rust = { version = "1.99.0", components = "clippy,rustfmt" }
git-cliff = "2.14.2"

[tasks.build]
description = "Build the place binary"
run = "cargo build"

[tasks.test]
description = "Run unit tests and the cucumber features"
run = [{ task = "test:unit" }, { task = "test:features" }]

[tasks."test:unit"]
description = "Run unit tests"
run = "cargo test --bins"

[tasks."test:features"]
description = "Run the cucumber features in features/"
run = "cargo test --test cucumber"

[tasks.lint]
description = "Check formatting and run clippy"
run = ["cargo fmt --check", "cargo clippy --all-targets -- -D warnings"]

[tasks.fmt]
description = "Format the code"
run = "cargo fmt"

[tasks."release:version"]
description = "Print the version the next release would get, from the commits since the last"
run = "git cliff --bumped-version"

[tasks."release:notes"]
description = "Print the notes for the next release"
run = "git cliff --unreleased --strip all"

[tasks.dist]
description = "Build a release archive for this platform in dist/"
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo build --release --locked
pkgid=$(cargo pkgid)
version=${pkgid##*[#@]}
os=$(uname -s | tr '[:upper:]' '[:lower:]')
mkdir -p dist
tar -czf "dist/place-$version-$os-$(uname -m).tar.gz" -C target/release place
'''
